name: Defense News Auto Collector

on:
  schedule:
    # 매일 밤 자정(KST 기준 00:00)에 실행. (GitHub 서버는 영국 시간 UTC 기준이므로 9시간을 뺀 15시로 설정합니다)
    - cron: "0 15 * * *"
  workflow_dispatch: # 내가 원할 때 수동으로 버튼을 눌러서 실행할 수 있게 해주는 옵션

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 파일 가져오기 (Checkout)
        uses: actions/checkout@v3

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl

      - name: 파이썬 뉴스 수집기 실행
        env:
          # GitHub Secrets에 숨겨둔 API 키를 불러와서 환경 변수로 주입
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python news_collector.py

      - name: 수집된 엑셀과 이미지를 GitHub에 자동 업로드(Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 언론보도_기고칼럼_db.xlsx news_images/
          # 변경사항이 없으면 에러가 나지 않도록 예외 처리
          git commit -m "Auto-update: Daily News Data" || echo "No changes to commit"
          git push
